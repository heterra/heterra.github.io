# Once a day: refresh stats.json from Google Analytics and publish it.
# Secrets needed in the repository: GA_PROPERTY_ID, GA_SERVICE_ACCOUNT_JSON.
name: Update download stats
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r .github/scripts/requirements.txt
      - run: python .github/scripts/update_stats.py
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
      - name: Publish if changed
        run: |
          git diff --quiet stats.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git commit -m "Update download stats"
          git push
